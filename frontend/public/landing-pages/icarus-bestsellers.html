  <meta charset="utf-8">

  <title>ICARUS — Ignite your mind</title>
  <style>
    :root {
      --ink: #29251d;
      --ink-deep: #1d1a15;
      --ink-soft: #3a382b;
      --pink: #c3a47b;
      --pink-bright: #dbc39c;
      --text: #eee2ca;
      --muted: #c5b79e;
      --periwinkle: #b7976c;
      --sage: #89946f;
      --clay: #a96346;
      --moss: #5f684f;
      --paper: #eadfc7;
      --serif: "Iowan Old Style", "Palatino Linotype", Palatino, "Book Antiqua",
        Baskerville, Georgia, serif;
      --ease: cubic-bezier(.2, .78, .2, 1);
      --mx: 0px;
      --my: 0px;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      background: var(--ink);
    }

    body {
      min-height: 100svh;
      overflow: hidden;
      color: var(--text);
      font-family: var(--serif);
      -webkit-font-smoothing: antialiased;
      cursor: default;
    }

    button,
    a {
      font: inherit;
    }

    button {
      color: inherit;
    }

    .stage {
      position: relative;
      isolation: isolate;
      width: 100%;
      min-height: 100svh;
      overflow: hidden;
      background:
        radial-gradient(circle at 49% 84%, rgba(117, 102, 71, .2), transparent 34%),
        radial-gradient(circle at 14% 4%, rgba(100, 112, 77, .12), transparent 28%),
        linear-gradient(180deg, #343025 0%, var(--ink) 48%, #211e18 100%);
    }

    .stage::after {
      content: "";
      position: absolute;
      z-index: 30;
      inset: 0;
      pointer-events: none;
      opacity: .14;
      background-image:
        url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.86' numOctaves='2' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.22'/%3E%3C/svg%3E");
      mix-blend-mode: soft-light;
    }

    .topbar {
      position: fixed;
      z-index: 50;
      top: 0;
      left: 0;
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      padding: 26px 3.2vw;
      pointer-events: none;
    }

    .brand {
      color: var(--pink);
      font-size: clamp(23px, 2.1vw, 30px);
      font-style: italic;
      font-weight: 600;
      letter-spacing: -.035em;
      line-height: 1;
      text-decoration: none;
      pointer-events: auto;
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 12px;
      pointer-events: auto;
    }

    .icon-button,
    .ticket-button,
    .close-button,
    .pill,
    .book-card {
      border: 0;
      outline: 0;
      -webkit-tap-highlight-color: transparent;
    }

    .icon-button,
    .ticket-button {
      height: 50px;
      border: 1px solid rgba(61, 49, 35, .18);
      background: var(--paper);
      color: #30291f;
      box-shadow: 0 8px 26px rgba(28, 22, 14, .13);
      transition: transform 240ms var(--ease), background-color 240ms ease;
    }

    .icon-button {
      display: grid;
      width: 50px;
      place-items: center;
      border-radius: 50%;
      cursor: pointer;
    }

    .menu-glyph {
      position: relative;
      width: 14px;
      height: 10px;
    }

    .menu-glyph::before,
    .menu-glyph::after {
      content: "";
      position: absolute;
      left: 1px;
      width: 12px;
      height: 2px;
      border-radius: 2px;
      background: currentColor;
      transition: transform 300ms var(--ease), top 300ms var(--ease);
    }

    .menu-glyph::before {
      top: 2px;
    }

    .menu-glyph::after {
      top: 7px;
    }

    [data-menu="open"] .menu-glyph::before {
      top: 5px;
      transform: rotate(45deg);
    }

    [data-menu="open"] .menu-glyph::after {
      top: 5px;
      transform: rotate(-45deg);
    }

    .ticket-button {
      display: inline-grid;
      min-width: 138px;
      padding: 0 25px;
      place-items: center;
      border-radius: 999px;
      cursor: pointer;
      font-size: 14px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: .08em;
      text-transform: uppercase;
      text-decoration: none;
    }

    .icon-button:hover,
    .ticket-button:hover {
      transform: translateY(-3px);
      background: #f7edd9;
    }

    .icon-button:focus-visible,
    .ticket-button:focus-visible,
    .close-button:focus-visible,
    .pill:focus-visible,
    .menu-link:focus-visible {
      outline: 2px solid #fff;
      outline-offset: 4px;
    }

    .hero-word {
      position: absolute;
      z-index: 1;
      top: 11.5vh;
      left: 50%;
      margin: 0;
      color: var(--pink);
      font-size: clamp(184px, 22vw, 325px);
      font-style: italic;
      font-weight: 500;
      letter-spacing: -.085em;
      line-height: .84;
      white-space: nowrap;
      transform: translate3d(calc(-50% + var(--mx) * -.12), calc(var(--my) * -.12), 0);
      transition: opacity 700ms ease, filter 700ms ease, transform 900ms var(--ease);
      user-select: none;
    }

    .gallery {
      position: absolute;
      z-index: 5;
      inset: 0;
      perspective: 1400px;
      transform-style: flat;
    }

    .book-card {
      --hover-y: 0px;
      --local-x: 0px;
      --local-y: 0px;
      position: absolute;
      left: var(--x);
      top: var(--y);
      width: var(--w);
      aspect-ratio: .672 / 1;
      padding: 0;
      background: transparent;
      cursor: pointer;
      transform:
        translate3d(
          calc(-50% + var(--local-x)),
          calc(var(--hover-y) + var(--local-y)),
          0
        )
        rotate(var(--r))
        rotateY(var(--yaw));
      transform-style: preserve-3d;
      transition:
        left 1100ms var(--ease),
        top 1100ms var(--ease),
        width 1100ms var(--ease),
        opacity 500ms ease,
        filter 500ms ease,
        transform 520ms var(--ease);
      will-change: transform, left, top, width;
    }

    .book-card[data-book="codex"] {
      --x: 23.2%;
      --y: 40.5%;
      --w: min(30.5vw, 435px);
      --r: -8deg;
      --yaw: -7deg;
      z-index: 1;
    }

    .book-card[data-book="claude"] {
      --x: 50%;
      --y: 32.2%;
      --w: min(33vw, 470px);
      --r: .8deg;
      --yaw: -3deg;
      z-index: 3;
    }

    .book-card[data-book="cursor"] {
      --x: 77%;
      --y: 42%;
      --w: min(30.5vw, 435px);
      --r: 8deg;
      --yaw: 7deg;
      z-index: 2;
    }

    .book-card:hover,
    .book-card[data-hovered="true"] {
      --hover-y: -28px;
      z-index: 8;
    }

    .book {
      position: relative;
      display: block;
      width: 100%;
      height: 100%;
      transform-style: preserve-3d;
      transition: transform 800ms var(--ease);
    }

    .book-card:hover .book {
      transform: scale(1.035) rotateX(-1.5deg);
    }

    .book-back,
    .page-block,
    .page-fan,
    .front-cover,
    .book-shadow {
      position: absolute;
      inset: 0;
      border-radius: 3px 7px 7px 3px;
    }

    .book-shadow {
      z-index: -2;
      inset: 5% -4% -2% 4%;
      border-radius: 12px;
      background: rgba(24, 18, 10, .7);
      filter: blur(22px);
      opacity: .72;
      transform: translate3d(18px, 28px, -60px);
    }

    .book-back {
      z-index: 0;
      background: var(--cover-color);
      box-shadow: 0 18px 30px rgba(24, 18, 10, .4);
      transform: translate3d(7px, 1px, -26px);
    }

    .page-block {
      z-index: 1;
      inset: 1.7% 1.4% 1.7% 3.8%;
      overflow: visible;
      border: 1px solid rgba(84, 68, 45, .25);
      border-radius: 2px 5px 5px 2px;
      background:
        repeating-linear-gradient(
          0deg,
          rgba(105, 86, 58, .14) 0,
          rgba(105, 86, 58, .14) 1px,
          transparent 1px,
          transparent 2.8px
        ),
        linear-gradient(90deg, #cfc1a4 0%, #f2e8d2 14%, #e7dac0 87%, #cbb894 100%);
      box-shadow: 7px 5px 16px rgba(31, 23, 13, .26);
      transform: translate3d(7px, 1px, -12px);
      transition: transform 1100ms var(--ease), inset 1100ms var(--ease);
    }

    .page-block::before {
      content: "";
      position: absolute;
      top: -7px;
      right: 1px;
      left: 1px;
      height: 8px;
      border-radius: 2px 4px 0 0;
      background:
        repeating-linear-gradient(
          90deg,
          #d9cbae 0,
          #d9cbae 2px,
          #f2e7cf 2px,
          #f2e7cf 5px
        );
      transform: skewX(-8deg);
      transform-origin: bottom left;
    }

    .page-block::after {
      content: "";
      position: absolute;
      top: 0;
      right: -7px;
      width: 8px;
      height: 100%;
      border-radius: 0 4px 4px 0;
      background:
        repeating-linear-gradient(
          0deg,
          #cbb995 0,
          #cbb995 1px,
          #eee3cd 1px,
          #eee3cd 3px
        );
      box-shadow: 3px 2px 7px rgba(35, 26, 14, .18);
      transform: skewY(-2deg);
      transform-origin: left center;
    }

    .page-fan {
      z-index: 2;
      inset: 2.4% 2% 2.4% 4.3%;
      pointer-events: none;
      transform-style: preserve-3d;
    }

    .page-fan i {
      position: absolute;
      inset: 0;
      display: block;
      border: 1px solid rgba(102, 83, 55, .22);
      border-radius: 2px 5px 5px 2px;
      background:
        linear-gradient(90deg, rgba(116, 91, 56, .22), transparent 9%),
        repeating-linear-gradient(
          0deg,
          #f0e6d0 0,
          #f0e6d0 2px,
          #e6d8ba 2px,
          #e6d8ba 3px
        );
      box-shadow: 3px 5px 10px rgba(37, 28, 16, .08);
      opacity: 0;
      transform: translate3d(0, 0, 0) rotateY(0);
      transform-origin: 1.5% center;
      transition: opacity 500ms ease, transform 1200ms var(--ease);
    }

    .front-cover {
      z-index: 3;
      overflow: hidden;
      border: 1px solid rgba(238, 224, 194, .2);
      background-color: var(--cover-color);
      background-image: var(--cover);
      background-position: center;
      background-size: cover;
      box-shadow:
        0 25px 38px rgba(24, 18, 10, .4),
        inset -12px 0 18px rgba(0, 0, 0, .16),
        inset 4px 0 9px rgba(255, 255, 255, .12);
      transform: translate3d(0, 0, 12px);
      transform-origin: 1.5% center;
      transform-style: preserve-3d;
      transition: transform 1200ms var(--ease), box-shadow 600ms ease;
    }

    .front-cover::before {
      content: "";
      position: absolute;
      z-index: 3;
      top: 0;
      bottom: 0;
      left: 0;
      width: 5.5%;
      background:
        linear-gradient(
          90deg,
          rgba(0, 0, 0, .35),
          rgba(255, 255, 255, .08) 35%,
          rgba(0, 0, 0, .12) 75%,
          transparent
        );
      mix-blend-mode: multiply;
      opacity: .8;
    }

    .front-cover::after {
      content: "";
      position: absolute;
      z-index: 4;
      inset: 0;
      border: 3px solid rgba(255, 255, 255, .04);
      border-radius: inherit;
      pointer-events: none;
    }

    .cover-motion {
      position: absolute;
      z-index: 1;
      inset: 0;
      display: block;
      width: 100%;
      height: 100%;
      object-fit: cover;
      opacity: 0;
      transition: opacity 420ms ease;
      pointer-events: none;
    }

    .cover-motion[data-ready="true"] {
      opacity: 1;
    }

    .cover-copy {
      position: absolute;
      z-index: 2;
      inset: 5.8% 7.5% 5.5%;
      display: grid;
      grid-template-rows: auto auto auto 1fr auto;
      align-content: start;
      color: var(--cover-ink);
      text-align: center;
      text-shadow: 0 1px 0 rgba(241, 226, 196, .24);
    }

    .cover-kicker {
      font-size: clamp(8px, .72vw, 11px);
      font-style: italic;
      font-weight: 600;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .cover-title {
      margin-top: 2.2%;
      font-size: clamp(35px, 4.3vw, 64px);
      font-weight: 600;
      letter-spacing: -.055em;
      line-height: .9;
    }

    .cover-subtitle {
      margin-top: 3%;
      font-size: clamp(10px, 1.05vw, 15px);
      font-style: italic;
      font-weight: 600;
      letter-spacing: .035em;
    }

    .cover-footer {
      align-self: end;
      padding-top: 3%;
      border-top: 1px solid currentColor;
      font-size: clamp(7px, .62vw, 9px);
      font-weight: 700;
      letter-spacing: .18em;
      text-transform: uppercase;
    }

    .book-card[data-book="codex"] .cover-copy {
      --cover-ink: #31291e;
    }

    .book-card[data-book="claude"] .cover-copy {
      --cover-ink: #4b281a;
    }

    .book-card[data-book="cursor"] .cover-copy {
      --cover-ink: #293024;
    }

    .open-badge {
      position: absolute;
      z-index: 6;
      top: 47%;
      left: 50%;
      display: grid;
      width: 94px;
      height: 66px;
      place-items: center;
      color: #312a21;
      background: #efe3ca;
      clip-path: polygon(
        3% 22%, 10% 8%, 25% 7%, 38% 1%, 51% 6%, 66% 2%,
        77% 10%, 92% 11%, 96% 26%, 100% 39%, 95% 52%, 99% 67%,
        88% 79%, 83% 93%, 68% 94%, 55% 100%, 42% 94%, 27% 98%,
        17% 88%, 4% 84%, 5% 69%, 0 57%, 5% 43%, 1% 34%
      );
      font-size: 11px;
      font-style: italic;
      font-weight: 700;
      letter-spacing: .12em;
      opacity: 0;
      transform: translate(-50%, -50%) scale(.76) rotate(-3deg);
      transition: opacity 260ms ease, transform 420ms var(--ease), filter 260ms ease;
      pointer-events: none;
    }

    .book-card:hover .open-badge,
    .book-card[data-hovered="true"] .open-badge,
    .book-card:focus-visible .open-badge {
      opacity: 1;
      transform: translate(-50%, -50%) scale(1) rotate(-3deg);
    }

    .book-card:focus-visible {
      outline: 0;
    }

    .book-card:focus-visible .open-badge {
      filter:
        drop-shadow(0 7px 12px rgba(29, 22, 14, .34))
        drop-shadow(0 0 8px rgba(224, 190, 137, .28));
    }

    .detail-panel {
      position: absolute;
      z-index: 12;
      top: 14.5%;
      right: 4.5%;
      width: min(47.5%, 650px);
      opacity: 0;
      transition: opacity 520ms ease 280ms;
      pointer-events: none;
    }

    .detail-title {
      margin: 0 0 24px;
      color: var(--pink);
      font-size: clamp(52px, 5.7vw, 82px);
      font-style: italic;
      font-weight: 500;
      letter-spacing: -.055em;
      line-height: .96;
    }

    .detail-description {
      max-width: 600px;
      margin: 0;
      color: var(--muted);
      font-size: clamp(14px, 1.28vw, 17px);
      line-height: 1.64;
    }

    .detail-scroll {
      max-height: clamp(340px, calc(100svh - 450px), 600px);
      overflow-y: auto;
      overscroll-behavior: contain;
      padding: 0 22px 76px 0;
      -webkit-mask-image: linear-gradient(
        to bottom,
        #000 0,
        #000 calc(100% - 76px),
        transparent 100%
      );
      mask-image: linear-gradient(
        to bottom,
        #000 0,
        #000 calc(100% - 76px),
        transparent 100%
      );
      scrollbar-color: rgba(198, 139, 140, .76) rgba(73, 66, 49, .35);
      scrollbar-width: thin;
    }

    .detail-scroll:focus-visible {
      border-radius: 8px;
      outline: 1px solid rgba(231, 184, 185, .7);
      outline-offset: 8px;
    }

    .detail-scroll::-webkit-scrollbar {
      width: 5px;
    }

    .detail-scroll::-webkit-scrollbar-track {
      border-radius: 999px;
      background: rgba(73, 66, 49, .35);
    }

    .detail-scroll::-webkit-scrollbar-thumb {
      border-radius: 999px;
      background: rgba(198, 139, 140, .76);
    }

    .doc-section {
      margin-top: 26px;
      padding-top: 22px;
      border-top: 1px solid rgba(220, 200, 164, .2);
    }

    .doc-label {
      margin: 0 0 16px;
      color: var(--pink);
      font-size: 12px;
      font-style: italic;
      font-weight: 700;
      letter-spacing: .16em;
      text-transform: uppercase;
    }

    .doc-steps {
      display: grid;
      gap: 16px;
      margin: 0;
      padding: 0;
      list-style: none;
      counter-reset: guide-step;
    }

    .doc-steps li {
      display: grid;
      grid-template-columns: 34px 1fr;
      gap: 12px;
      counter-increment: guide-step;
    }

    .doc-steps li::before {
      content: counter(guide-step, decimal-leading-zero);
      padding-top: 2px;
      color: rgba(231, 184, 185, .7);
      font-size: 12px;
      font-style: italic;
      letter-spacing: .08em;
    }

    .doc-step-copy {
      display: grid;
      gap: 4px;
    }

    .doc-step-copy strong {
      color: #e8dcc4;
      font-size: 15px;
      font-style: italic;
      font-weight: 650;
    }

    .doc-step-copy span,
    .doc-review {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.58;
    }

    .prompt-block {
      padding: 17px 18px;
      border: 1px solid rgba(220, 200, 164, .2);
      border-radius: 12px;
      background: rgba(52, 48, 37, .62);
      box-shadow: inset 0 1px 0 rgba(255, 255, 255, .035);
    }

    .prompt-block code {
      color: #e8dcc4;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
      line-height: 1.58;
      white-space: pre-wrap;
    }

    .doc-review {
      margin: 0;
    }

    .meta-row {
      display: grid;
      grid-template-columns: max-content 1px max-content 1fr;
      align-items: center;
      gap: clamp(16px, 2vw, 27px);
      margin-top: 22px;
      color: var(--pink);
    }

    .stars {
      display: flex;
      gap: 8px;
      font-size: 24px;
      letter-spacing: .02em;
      line-height: 1;
    }

    .stars .dim {
      color: #665f4d;
    }

    .meta-divider {
      width: 1px;
      height: 26px;
      background: rgba(220, 200, 164, .28);
    }

    .review-source,
    .year {
      color: #bcae92;
      font-size: 18px;
      font-style: italic;
      font-weight: 650;
    }

    .year {
      justify-self: end;
    }

    .detail-rule {
      height: 1px;
      margin: 10px 0 22px;
      border: 0;
      background: rgba(220, 200, 164, .24);
    }

    .bottom-dock {
      position: fixed;
      z-index: 24;
      right: 4.5%;
      bottom: 28px;
      width: min(47.5%, 650px);
    }

    .bottom-dock .meta-row {
      margin: 0 10px;
    }

    .bottom-dock .detail-rule {
      margin: 10px 8px 14px;
    }

    .action-rail {
      --action-inset: 8px;
      display: flex;
      align-items: center;
      gap: var(--action-inset);
      width: 100%;
      padding: var(--action-inset);
      border: 1px solid rgba(238, 226, 202, .07);
      border-radius: 32px;
      background: rgba(64, 58, 43, .88);
      box-shadow: 0 16px 32px rgba(26, 20, 12, .2);
      backdrop-filter: blur(12px);
    }

    .pill {
      display: inline-flex;
      flex: 1 1 0;
      align-items: center;
      justify-content: center;
      min-width: 0;
      min-height: 58px;
      padding: 0 18px;
      border-radius: 24px;
      background: var(--periwinkle);
      color: #2e261d;
      cursor: pointer;
      font-size: 15px;
      font-style: italic;
      font-weight: 700;
      white-space: nowrap;

      left: var(--blossom-x);
      width: var(--blossom-size);
      height: var(--blossom-size);
      opacity: .92;
      transform-style: preserve-3d;
      animation: blossomFall var(--blossom-duration) linear var(--blossom-delay) infinite;
    }

    .blossom i {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 42%;
      height: 60%;
      border-radius: 72% 72% 58% 58%;
      background:
        radial-gradient(circle at 50% 82%, rgba(187, 103, 108, .9) 0 10%, transparent 11%),
        linear-gradient(180deg, #f5d8d3 0%, #e6aaa9 74%, #c78184 100%);
      box-shadow: inset 1px 1px 0 rgba(255, 255, 255, .42);
      transform-origin: 50% 100%;

      transform: translate(-50%, -100%) rotate(0deg);
    }

    .blossom i:nth-child(2) {
      transform: translate(-50%, -100%) rotate(72deg);
    }

    .blossom i:nth-child(3) {
      transform: translate(-50%, -100%) rotate(144deg);
    }

    .blossom i:nth-child(4) {
      transform: translate(-50%, -100%) rotate(216deg);
    }

    .blossom i:nth-child(5) {
      transform: translate(-50%, -100%) rotate(288deg);
    }

    .blossom::after {
      content: "";
      position: absolute;
      top: 50%;
      left: 50%;
      width: 18%;
      height: 18%;
      border-radius: 50%;
      background: #d9b46f;
      box-shadow: 0 0 0 2px rgba(107, 70, 51, .18);
      transform: translate(-50%, -50%);

      }
      68% {

      }
      100% {

      const body = document.body;
      const stage = document.querySelector(".stage");
      const cards = [...document.querySelectorAll(".book-card")];
      const detailPanel = document.querySelector("#detailPanel");
      const detailTitle = document.querySelector("#detailTitle");
      const detailScroll = document.querySelector("#detailScroll");
      const detailDescription = document.querySelector("#detailDescription");
      const detailSteps = document.querySelector("#detailSteps");
      const detailPrompt = document.querySelector("#detailPrompt");
      const detailReview = document.querySelector("#detailReview");
      const detailYear = document.querySelector("#detailYear");
      const closeButton = document.querySelector("#closeButton");
      const menuButton = document.querySelector("#menuButton");
      const menuLayer = document.querySelector("#menuLayer");
      const saveButton = document.querySelector("#saveButton");
      const toast = document.querySelector("#toast");
      const reducedMotion = window.matchMedia("(prefers-reduced-motion: reduce)");
      const coverVideos = [...document.querySelectorAll(".cover-motion")];
      let selectedCard = null;
      let toastTimer = 0;
      let frame = 0;
      let pointerX = 0;
      let pointerY = 0;
      let pointerClientX = -10000;
      let pointerClientY = -10000;

      function showToast(message) {
        window.clearTimeout(toastTimer);
        toast.textContent = message;
        toast.dataset.show = "true";
        toastTimer = window.setTimeout(() => {
          toast.dataset.show = "false";
        }, 1800);
      }

      function syncCoverMotion() {
        coverVideos.forEach((video) => {
          const card = video.closest(".book-card");
          const isVisibleBook =
            body.dataset.mode === "gallery" ||
            (body.dataset.mode === "detail" && card === selectedCard);
          const shouldPlay =
            !reducedMotion.matches &&
            !document.hidden && window.__icarusRendering &&
            isVisibleBook;

          if (!shouldPlay) {
            video.pause();
            return;
          }

          const playRequest = video.play();
          if (playRequest) playRequest.catch(() => {});
        });
      }

      function updateParallax() {
        frame = 0;
        if (reducedMotion.matches) return;

        if (body.dataset.mode === "detail" && selectedCard) {
          const bounds = selectedCard.getBoundingClientRect();
          const bookCenterX = bounds.left + bounds.width / 2;
          const bookCenterY = bounds.top + bounds.height / 2;
          const isPointerInViewport =
            pointerClientX >= 0 &&
            pointerClientX <= window.innerWidth &&
            pointerClientY >= 0 &&
            pointerClientY <= window.innerHeight;
          const horizontalReach = pointerClientX < bookCenterX
            ? Math.max(bookCenterX, 1)
            : Math.max(window.innerWidth - bookCenterX, 1);
          const verticalReach = pointerClientY < bookCenterY
            ? Math.max(bookCenterY, 1)
            : Math.max(window.innerHeight - bookCenterY, 1);
          const viewportX = isPointerInViewport
            ? Math.max(-1, Math.min(1, (pointerClientX - bookCenterX) / horizontalReach))
            : -5 / 16;
          const viewportY = isPointerInViewport
            ? Math.max(-1, Math.min(1, (pointerClientY - bookCenterY) / verticalReach))
            : 0;
          selectedCard.style.setProperty("--detail-yaw", `${viewportX * 16}deg`);
          selectedCard.style.setProperty("--detail-pitch", `${viewportY * -10}deg`);
          selectedCard.dataset.orbiting = String(isPointerInViewport);
          return;
        }

        if (body.dataset.mode !== "gallery") return;

        document.documentElement.style.setProperty("--mx", `${pointerX * 11}px`);
        document.documentElement.style.setProperty("--my", `${pointerY * 8}px`);

        cards.forEach((card, index) => {
          const depth = index === 1 ? 1 : .58;
          card.style.setProperty("--local-x", `${pointerX * 15 * depth}px`);
          card.style.setProperty("--local-y", `${pointerY * 9 * depth}px`);
        });
      }

      function selectBook(card) {
        if (body.dataset.mode === "detail") return;
        const data = books[card.dataset.book];
        if (!data) return;

        selectedCard = card;
        selectedCard.style.setProperty("--detail-yaw", "-5deg");
        selectedCard.style.setProperty("--detail-pitch", "0deg");
        selectedCard.dataset.orbiting = "false";
        detailTitle.textContent = data.title;
        detailDescription.textContent = data.description;
        detailSteps.replaceChildren(...data.steps.map((step) => {
          const item = document.createElement("li");
          const copy = document.createElement("span");
          const title = document.createElement("strong");
          const bodyCopy = document.createElement("span");
          copy.className = "doc-step-copy";
          title.textContent = step.title;
          bodyCopy.textContent = step.body;
          copy.append(title, bodyCopy);
          item.append(copy);
          return item;
        }));
        detailPrompt.textContent = data.prompt;
        detailReview.textContent = data.review;
        detailScroll.scrollTop = 0;
        detailYear.textContent = data.year;
        cards.forEach((item) => item.classList.toggle("selected", item === card));
        cards.forEach((item) => { item.tabIndex = -1; });
        body.dataset.mode = "detail";
        syncCoverMotion();
        detailPanel.setAttribute("aria-hidden", "false");
        detailPanel.inert = false;
        closeButton.tabIndex = 0;
        saveButton.setAttribute("aria-pressed", "false");
        window.setTimeout(() => {
          closeButton.focus({ preventScroll: true });
          if (window.innerWidth > 900) stage.scrollTop = 0;
        }, reducedMotion.matches ? 0 : 700);
      }

      function closeDetail() {
        if (body.dataset.mode !== "detail") return;
        body.dataset.mode = "gallery";
        syncCoverMotion();
        detailPanel.setAttribute("aria-hidden", "true");
        detailPanel.inert = true;
        closeButton.tabIndex = -1;
        const lastCard = selectedCard;
        lastCard?.style.setProperty("--detail-yaw", "-5deg");
        lastCard?.style.setProperty("--detail-pitch", "0deg");
        if (lastCard) lastCard.dataset.orbiting = "false";
        window.setTimeout(() => {
          cards.forEach((card) => card.classList.remove("selected"));
          cards.forEach((card) => { card.tabIndex = 0; });
          selectedCard = null;
          lastCard?.focus({ preventScroll: true });
          if (window.innerWidth > 900) stage.scrollTop = 0;
        }, reducedMotion.matches ? 0 : 700);
      }

      function toggleMenu(force) {
        const willOpen = typeof force === "boolean"
          ? force
          : body.dataset.menu !== "open";
        body.dataset.menu = willOpen ? "open" : "closed";
        menuLayer.inert = !willOpen;
        menuButton.setAttribute("aria-expanded", String(willOpen));
        menuButton.setAttribute("aria-label", willOpen ? "Close menu" : "Open menu");
      }

      cards.forEach((card) => {
        card.addEventListener("click", () => selectBook(card));
        card.addEventListener("pointerenter", () => card.dataset.hovered = "true");
        card.addEventListener("pointerleave", () => card.dataset.hovered = "false");
      });

      coverVideos.forEach((video) => {
        const revealVideo = () => { video.dataset.ready = "true"; };
        if (video.readyState >= 2) {
          revealVideo();
        } else {
          video.addEventListener("loadeddata", revealVideo, { once: true });
        }
      });

      document.addEventListener("visibilitychange", syncCoverMotion);
      window.addEventListener("icarus-render-state", syncCoverMotion);
      if (reducedMotion.addEventListener) {
        reducedMotion.addEventListener("change", syncCoverMotion);
      } else {
        reducedMotion.addListener(syncCoverMotion);
      }
      syncCoverMotion();

      window.addEventListener("pointermove", (event) => {
        pointerX = event.clientX / window.innerWidth - .5;
        pointerY = event.clientY / window.innerHeight - .5;
        pointerClientX = event.clientX;
        pointerClientY = event.clientY;
        if (!frame) frame = window.requestAnimationFrame(updateParallax);
      }, { passive: true });

      window.addEventListener("pointerleave", () => {
        pointerX = 0;
        pointerY = 0;
        pointerClientX = -10000;
        pointerClientY = -10000;
        if (!frame) frame = window.requestAnimationFrame(updateParallax);
      });

      closeButton.addEventListener("click", closeDetail);
      menuButton.addEventListener("click", () => toggleMenu());

      saveButton.addEventListener("click", () => {
        const saved = saveButton.getAttribute("aria-pressed") !== "true";
        saveButton.setAttribute("aria-pressed", String(saved));
        showToast(saved ? "Saved to your reading list." : "Removed from your reading list.");
      });

      document.addEventListener("click", (event) => {
        const toastTarget = event.target.closest("[data-toast]");
        if (toastTarget) {
          event.preventDefault();
          showToast(toastTarget.dataset.toast);
        }

        if (event.target.closest("[data-menu-close]")) {
          toggleMenu(false);
        }
      });

      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape") {
          if (body.dataset.menu === "open") {
            toggleMenu(false);
          } else {
            closeDetail();
          }
        }
      });
    })();
  </script>
<script id="icarus-entry-actions">
function resetIcarusLibrary() {
  if (document.body.dataset.mode === 'detail') document.querySelector('#closeButton').click();
  if (document.body.dataset.menu === 'open') document.querySelector('#menuButton').click();
}
document.addEventListener('click', function(event) {
  var control = event.target.closest('[data-icarus-entry], [data-icarus-library]');
  if (!control) return;
  if (control.dataset.icarusLibrary !== undefined) {
    event.preventDefault();
    resetIcarusLibrary();
    return;
  }
  var action = control.dataset.icarusEntry;
  if (control.matches('.book-card')) {
    // Let the original click handler open the cover before changing screens.
    window.setTimeout(function() {
      if (document.body.dataset.mode === 'detail' && control.classList.contains('selected')) {
        parent.postMessage({type:'icarus-entry-action', action:action}, '*');
      }
    }, window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : 1200);
  } else {
    event.preventDefault();
    parent.postMessage({type:'icarus-entry-action', action:action}, '*');
  }
});
window.addEventListener('message', function(event) {
  if (event.source !== window.parent || event.data?.type !== 'icarus-entry-reset') return;
  resetIcarusLibrary();
});
parent.postMessage({type:'icarus-entry-ready'}, '*');
</script>
